<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | strip_html }} · {% endif %}Generative AI Lab</title>
<style>
  /* The look of your Product Page. Change --accent to your product's colour if you like. */
  :root {
    --ink: #1a1915;
    --muted: #5e5a52;
    --paper: #faf9f6;
    --panel: #f1eee7;
    --line: #e3dfd6;
    --accent: #1a1915;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; }
  .course { font-size: 15px; color: var(--muted); margin: 0 0 40px; }
  h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px; }
  h1 + p { font-size: 22px; line-height: 1.45; margin: 0 0 24px; }
  h1 + p + p { margin-bottom: 56px; }
  h1 + p + p a { font-weight: 600; }
  h2 { font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; margin: 64px 0 16px; }
  h3 { font-size: 18px; line-height: 1.3; margin: 32px 0 8px; }
  p { margin: 0 0 12px; }
  a { color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  ol, ul { padding-left: 24px; margin: 0 0 12px; }
  li { margin-bottom: 6px; padding-left: 4px; }
  p > img:only-child { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 16px; margin: 16px 0; }
  th, td { text-align: left; padding: 10px 16px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { font-size: 14px; font-weight: 600; color: var(--muted); }
  code { font-size: 0.9em; background: var(--panel); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
<p class="course">Generative AI Lab · NYU Stern · Fall 2026</p>
{{ content }}
</main>
</body>
</html>
